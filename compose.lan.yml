# Standalone LAN stack; do not merge with the machine-specific development compose.
name: family-gifting-lan

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: family_gifting
      POSTGRES_USER: gifting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.lan}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U gifting -d family_gifting']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://gifting:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.lan}@postgres:5432/family_gifting
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.lan}
      CORS_ORIGINS: ${LAN_ORIGIN:?Set LAN_ORIGIN to the chosen phone URL}
      # Relative URLs stay on the same gateway as the web app.
      PUBLIC_API_URL: ''
      UPLOAD_DIR: /tmp/uploads
    volumes:
      - uploads:/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_WS_URL: /ws
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:stable-alpine
    ports:
      - '${LAN_BIND_IP:?Set LAN_BIND_IP to a private LAN interface}:${LAN_PORT:-3030}:80'
    volumes:
      - ./deploy/lan/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:
