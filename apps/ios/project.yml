name: FamilyGifting
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  FamilyGiftingKit:
    path: FamilyGiftingKit
targets:
  FamilyGifting:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: FamilyGifting
        excludes: [Info.plist]
    dependencies:
      - package: FamilyGiftingKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.familygifting.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: FamilyGifting/Info.plist
      properties:
        CFBundleDisplayName: Family Gifting
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchStoryboardName: LaunchScreen
        UIAppFonts: [Montserrat-Bold.otf, OpenSans-Regular.ttf]
        UIUserInterfaceStyle: Light
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: Connect to your family's gifting server on your home network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  FamilyGifting:
    build:
      targets:
        FamilyGifting: all
    run:
      config: Debug
